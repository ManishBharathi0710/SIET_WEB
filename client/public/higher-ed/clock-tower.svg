    <path d="M50 160 L65 142 L80 160 Z" />
    <path d="M100 160 L115 142 L130 160 Z" />
    <path d="M150 160 L165 142 L180 160 Z" />
    
    <!-- Arcaded Upper Windows -->
    <path d="M38 195 C38 185 58 185 58 195 V225 H38 Z" />
    <path d="M72 195 C72 185 92 185 92 195 V225 H72 Z" />
    <path d="M106 195 C106 185 126 185 126 195 V225 H106 Z" />
    <path d="M140 195 C140 185 160 185 160 195 V225 H140 Z" />
    <path d="M174 195 C174 185 194 185 194 195 V225 H174 Z" />
    
    <!-- Lower Colonnade / Arches -->
    <path d="M36 260 C36 242 60 242 60 260 V320 H36 Z" />
    <path d="M70 260 C70 242 94 242 94 260 V320 H70 Z" />
    <path d="M104 260 C104 242 128 242 128 260 V320 H104 Z" />
    <path d="M138 260 C138 242 162 242 162 260 V320 H138 Z" />
    <path d="M172 260 C172 242 196 242 196 260 V320 H172 Z" />
    
