    <circle cx="265" cy="132" r="1" />
    <circle cx="281" cy="148" r="1" />
    <circle cx="265" cy="164" r="1" />
    <circle cx="249" cy="148" r="1" />
    
    <!-- Gothic Arched Windows in Tower -->
    <path d="M248 200 C248 188 282 188 282 200 V232 H248 Z" />
    <line x1="265" y1="190" x2="265" y2="232" />
    <path d="M252 260 C252 248 278 248 278 260 V300 H252 Z" />
    
    <!-- Long Arcaded Wing to the Left -->
    <rect x="20" y="170" width="210" height="150" />
