<svg width="400" height="340" viewBox="0 0 400 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#F4C400" stroke-width="1.3" opacity="0.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Clock Tower -->
    <rect x="230" y="80" width="70" height="240" />
    <line x1="230" y1="120" x2="300" y2="120" />
    <line x1="230" y1="180" x2="300" y2="180" />
    <line x1="230" y1="240" x2="300" y2="240" />
    
    <!-- Buttresses -->
    <line x1="222" y1="100" x2="230" y2="85" />
    <line x1="222" y1="100" x2="222" y2="320" />
    <line x1="308" y1="100" x2="300" y2="85" />
    <line x1="308" y1="100" x2="308" y2="320" />
    
    <!-- Spire and Pinnacles -->
    <path d="M230 80 L265 10 L300 80 Z" />
    <line x1="265" y1="10" x2="265" y2="0" stroke-width="1.8" />
